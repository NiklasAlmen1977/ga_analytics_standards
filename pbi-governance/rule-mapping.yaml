metadata:
  name: "Group Analytics Power BI Rule Mapping"
  owner: "Group Analytics"
  version: "1.5.0"
  status: "draft"
  domain: "Power BI"

# bpa_rule_id values must match the "ID" field in the referenced BPA file.
# Every standard in standards.yaml has at least one entry.
# status: implemented (BPA rule exists), candidate (could become a BPA rule),
#         not_suitable_for_bpa (manual review; report standards may later get a PBIR check),
#         deprecated (no longer applied; the standard is removed in a later release).
# python_check: true - validators/validate_model.py checks (part of) the standard from the TMDL.
#         The script also evaluates every implemented BPA rule, so a new BPA rule needs a Python
#         check too (it lists rules without one as "not evaluated").

